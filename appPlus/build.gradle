plugins {
    id 'com.android.application'
}

android {
    namespace 'one.animex.plus'
    compileSdk 36

    defaultConfig {
        applicationId 'one.animex.plus'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-gecko-arm64'

        // Physical-device build: 64-bit ARM only.
        // This removes the 32-bit Gecko child executable/libs entirely.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Reuse the exact launcher artwork from the original Animex module.
// Copying at build time keeps Animex+ visually identical without maintaining
// a second, drifting copy of the icon files.
tasks.register('syncAnimexLauncherIcon', Copy) {
    from("${rootProject.projectDir}/app/src/main/res") {
        include 'drawable/ic_launcher_background.xml'
        include 'drawable/ic_launcher_foreground.png'
        include 'mipmap-anydpi-v26/ic_launcher.xml'
        include 'mipmap-anydpi-v26/ic_launcher_round.xml'
        include 'mipmap-mdpi/ic_launcher.png'
        include 'mipmap-mdpi/ic_launcher_round.png'
        include 'mipmap-hdpi/ic_launcher.png'
        include 'mipmap-hdpi/ic_launcher_round.png'
        include 'mipmap-xhdpi/ic_launcher.png'
        include 'mipmap-xhdpi/ic_launcher_round.png'
        include 'mipmap-xxhdpi/ic_launcher.png'
        include 'mipmap-xxhdpi/ic_launcher_round.png'
        include 'mipmap-xxxhdpi/ic_launcher.png'
        include 'mipmap-xxxhdpi/ic_launcher_round.png'
    }
    into("${projectDir}/src/main/res")
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncAnimexLauncherIcon')
}

dependencies {
    // Pin the GeckoView build that the first working test compiled against,
    // rather than allowing latest.release to change underneath us.
    implementation 'org.mozilla.geckoview:geckoview:153.0.20260810162159'
}
