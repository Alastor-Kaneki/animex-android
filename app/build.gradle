plugins {
    id 'com.android.application'
}

android {
    namespace 'one.animex'
    compileSdk 35

    defaultConfig {
        applicationId 'one.animex'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4'
    }

    signingConfigs {
        release {
            storeFile file('../animex-release.jks')
            storePassword 'AnimeX-Release-2026'
            keyAlias 'animex'
            keyPassword 'AnimeX-Release-2026'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
