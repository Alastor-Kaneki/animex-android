name: Build Orbit Launcher APK

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: Path to the Orbit Launcher project
        required: true
        default: OrbitLauncher
      build_type:
        description: APK build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: orbit-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # Do not use gradle/actions/setup-gradle here. That action scans every
      # wrapper JAR in the repository and rejects Orbit Launcher's custom
      # Termux bootstrap wrapper before the build can begin. Install the
      # official Gradle distribution directly instead.
      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_DIR="$RUNNER_TEMP/gradle-8.13"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-8.13-bin.zip"

          curl --fail --location --retry 4 --retry-delay 3 \
            --output "$GRADLE_ZIP" \
            "https://services.gradle.org/distributions/gradle-8.13-bin.zip"

          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          test -x "$GRADLE_DIR/bin/gradle"
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"
          "$GRADLE_DIR/bin/gradle" --version

      - name: Validate project
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          test -f "$PROJECT_PATH/settings.gradle.kts"
          test -f "$PROJECT_PATH/app/build.gradle.kts"

      - name: Build APK
        id: build
        shell: bash
        working-directory: ${{ inputs.project_path }}
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_TYPE" == "release" ]]; then
            gradle --no-daemon --stacktrace assembleRelease
            APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            ARTIFACT="OrbitLauncher-release-unsigned"
          else
            gradle --no-daemon --stacktrace assembleDebug
            APK="app/build/outputs/apk/debug/app-debug.apk"
            ARTIFACT="OrbitLauncher-debug"
          fi
          test -f "$APK"
          echo "apk=$PWD/$APK" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
