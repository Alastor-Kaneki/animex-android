name: Build Orbit Launcher APK

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: Path to the Orbit Launcher project
        required: true
        default: OrbitLauncher
      build_type:
        description: APK build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: orbit-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_DIR="$RUNNER_TEMP/gradle-8.13"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-8.13-bin.zip"

          curl --fail --location --retry 4 --retry-delay 3 \
            --output "$GRADLE_ZIP" \
            "https://services.gradle.org/distributions/gradle-8.13-bin.zip"

          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          test -x "$GRADLE_DIR/bin/gradle"
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"
          "$GRADLE_DIR/bin/gradle" --version

      - name: Apply launcher performance and appearance update
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          test -f "$PROJECT_PATH/settings.gradle.kts"
          test -f "$PROJECT_PATH/app/build.gradle.kts"

          PATCH_B64="$GITHUB_WORKSPACE/orbit-launcher-build/orbit-appearance-performance-patch.b64"
          PATCH_ARCHIVE="$RUNNER_TEMP/orbit-launcher-update.tgz"

          test -f "$PATCH_B64"
          tr -d '[:space:]' < "$PATCH_B64" | base64 --decode > "$PATCH_ARCHIVE"
          echo "56993a1616fa14b0d269ad863f573911b5b9c84a7833cbc697c32d3da857917b  $PATCH_ARCHIVE" | sha256sum -c -
          tar -xzf "$PATCH_ARCHIVE" -C "$PROJECT_PATH"

          MAIN_ACTIVITY="$PROJECT_PATH/app/src/main/java/com/alastor/orbitlauncher/MainActivity.kt"
          test -f "$MAIN_ACTIVITY"
          grep -q '^import android.app.role.RoleManager$' "$MAIN_ACTIVITY"
          grep -q 'FLAG_SHOW_WALLPAPER' "$MAIN_ACTIVITY"
          grep -q 'MAX_VISIBLE_NODES = 48' "$MAIN_ACTIVITY"
          grep -q 'dynamicDarkColorScheme' "$PROJECT_PATH/app/src/main/java/com/alastor/orbitlauncher/ui/theme/Theme.kt"
          test -f "$PROJECT_PATH/app/src/main/java/com/alastor/orbitlauncher/model/IconPackOption.kt"

      - name: Build APK
        id: build
        shell: bash
        working-directory: ${{ inputs.project_path }}
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_TYPE" == "release" ]]; then
            gradle --no-daemon --stacktrace assembleRelease
            APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            ARTIFACT="OrbitLauncher-release-unsigned"
          else
            gradle --no-daemon --stacktrace assembleDebug
            APK="app/build/outputs/apk/debug/app-debug.apk"
            ARTIFACT="OrbitLauncher-debug"
          fi
          test -f "$APK"
          echo "apk=$PWD/$APK" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
