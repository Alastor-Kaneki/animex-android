name: Build Animex APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing keystore
        shell: bash
        env:
          ANIMEX_KEYSTORE_B64: ${{ secrets.ANIMEX_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${ANIMEX_KEYSTORE_B64:-}" ]; then
            echo "ANIMEX_KEYSTORE_B64 is missing."
            exit 1
          fi

          printf '%s' "$ANIMEX_KEYSTORE_B64" |
            base64 --decode > animex-release.jks

          test -s animex-release.jks

          keytool -list \
            -keystore animex-release.jks \
            -storepass 'AnimeX-Release-2026' \
            -alias animex >/dev/null

          echo "Signing keystore restored."

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK 35 is available."

      - name: Build signed release APK
        shell: bash
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            clean assembleRelease 2>&1 |
            tee build.log

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            Animex.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animex-APK
          path: Animex.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Animex-build-log
          path: build.log
          if-no-files-found: warn
