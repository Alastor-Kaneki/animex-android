name: Build Animex+ Gecko/uBO Test APK

on:
  push:
    branches:
      - animex-plus
    paths:
      - appPlus/**
      - settings.gradle
      - build.gradle
      - gradle.properties
      - .github/workflows/build-animex-plus.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animex-plus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Animex
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bundle official signed uBlock Origin 1.72.0 XPI
        shell: bash
        run: |
          set -euo pipefail
          UBO_URL="https://github.com/gorhill/uBlock/releases/download/1.72.0/uBlock0_1.72.0.firefox.signed.xpi"
          UBO_SHA256="79cd426ab599801c59dfe9895cb4b8002faf3da059f7111c2721ac10168a3b64"

          rm -rf appPlus/src/main/assets/ublock
          mkdir -p appPlus/src/main/assets/ublock
          curl --fail --location --retry 3 "$UBO_URL" \
            --output appPlus/src/main/assets/ublock/uBlockOrigin.xpi

          echo "$UBO_SHA256  appPlus/src/main/assets/ublock/uBlockOrigin.xpi" | sha256sum -c -
          unzip -p appPlus/src/main/assets/ublock/uBlockOrigin.xpi manifest.json \
            | grep -q 'uBlock0@raymondhill.net'

      - name: Build Animex+ debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle \
            --no-daemon \
            --stacktrace \
            :appPlus:assembleDebug 2>&1 | tee animex-plus-build.log

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="appPlus/build/outputs/apk/debug/appPlus-debug.apk"
          test -f "$SOURCE"

          OUT="AnimexPlus-0.3-arm64-native-uBO.apk"
          cp "$SOURCE" "$OUT"
          sha256sum "$OUT" > AnimexPlus-SHA256SUMS.txt

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT"

          unzip -l "$OUT" | grep -q 'assets/ublock/uBlockOrigin.xpi'
          unzip -l "$OUT" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$OUT" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected non-arm64 native libraries found" >&2
            exit 1
          fi

          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload Animex+ APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimexPlus-Gecko-uBO-${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.path }}
            AnimexPlus-SHA256SUMS.txt
            animex-plus-build.log
          if-no-files-found: error
          retention-days: 30
