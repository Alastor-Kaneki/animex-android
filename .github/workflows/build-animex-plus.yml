name: Build Animex+ Gecko/uBO Test APK

on:
  push:
    branches:
      - animex-plus
    paths:
      - appPlus/**
      - settings.gradle
      - build.gradle
      - gradle.properties
      - .github/workflows/build-animex-plus.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animex-plus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Animex
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build uBlock Origin 1.72.0 for Firefox/Gecko
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.72.0 https://github.com/gorhill/uBlock.git /tmp/uBlock
          make -C /tmp/uBlock firefox

          test -f /tmp/uBlock/dist/build/uBlock0.firefox/manifest.json
          grep -q 'uBlock0@raymondhill.net' /tmp/uBlock/dist/build/uBlock0.firefox/manifest.json

          rm -rf appPlus/src/main/assets/ublock
          mkdir -p appPlus/src/main/assets/ublock
          cp -a /tmp/uBlock/dist/build/uBlock0.firefox/. appPlus/src/main/assets/ublock/

          echo "Bundled uBO manifest:"
          grep -E '"name"|"version"|"id"' appPlus/src/main/assets/ublock/manifest.json | head -20

      - name: Build Animex+ debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle \
            --no-daemon \
            --stacktrace \
            :appPlus:assembleDebug 2>&1 | tee animex-plus-build.log

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="appPlus/build/outputs/apk/debug/appPlus-debug.apk"
          test -f "$SOURCE"

          OUT="AnimexPlus-0.1-gecko-uBO-1.72.0.apk"
          cp "$SOURCE" "$OUT"
          sha256sum "$OUT" > AnimexPlus-SHA256SUMS.txt

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT"

          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload Animex+ APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimexPlus-Gecko-uBO-${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.path }}
            AnimexPlus-SHA256SUMS.txt
            animex-plus-build.log
          if-no-files-found: error
          retention-days: 30
