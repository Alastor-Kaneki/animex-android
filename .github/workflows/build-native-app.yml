name: Build Animex Plugins APK

on:
  push:
    branches:
      - main
    paths:
      - nativeapp/**
      - build.gradle
      - settings.gradle
      - gradle.properties
      - .github/workflows/build-native-app.yml
  pull_request:
    branches:
      - main
    paths:
      - nativeapp/**
      - build.gradle
      - settings.gradle
      - gradle.properties
      - .github/workflows/build-native-app.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animex-plugins-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore release signing keystore
        shell: bash
        env:
          ANIMEX_KEYSTORE_B64: ${{ secrets.ANIMEX_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${ANIMEX_KEYSTORE_B64:-}"
          printf '%s' "$ANIMEX_KEYSTORE_B64" | base64 --decode > animex-release.jks
          keytool -list -keystore animex-release.jks -storepass 'AnimeX-Release-2026' -alias animex >/dev/null

      - name: Build release APK
        shell: bash
        run: gradle --no-daemon --stacktrace :nativeapp:assembleRelease

      - name: Prepare release files
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" nativeapp/build.gradle | head -n 1)"
          SOURCE="nativeapp/build/outputs/apk/release/nativeapp-release.apk"
          APK="Animex-Plugins-v${VERSION}.apk"
          test -f "$SOURCE"
          cp "$SOURCE" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > Animex-Plugins-SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Animex-Plugins-v${{ steps.release.outputs.version }}-build.${{ github.run_number }}
          path: |
            ${{ steps.release.outputs.apk }}
            Animex-Plugins-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish tagged release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          APK: ${{ steps.release.outputs.apk }}
        run: |
          set -euo pipefail
          TAG="plugins-v${VERSION}"
          cat > release-notes.md <<EOF_NOTES
          ## Animex Plugins ${VERSION}

          Separate AMOLED, immersive plugin-based application.

          - Package: \`one.animex.plugins\`
          - Built-in source: AnimeX public web interface
          - No ad-provider lists, ad-provider extractors, popup filters, or wrapper protection scripts
          - Downloads: direct video and standard DRM-free HLS only
          EOF_NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" "$APK" Animex-Plugins-SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Animex Plugins ${VERSION}" \
            --notes-file release-notes.md
